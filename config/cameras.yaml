# Registry of the IP cameras.
# Adjust id, name and url to match the real data of each camera on your
# network. The "url" may be an RTSP stream (most common on dedicated IP
# cameras) or an HTTP/MJPEG URL, depending on the manufacturer.
#
# Credentials do not live here: the url references an environment
# variable (defined in .env, see .env.example) and is expanded at load
# time.

cameras:
  - id: "cam1"
    name: "C1"
    url: "${CAM1_URL}"
    enabled: true

  - id: "cam2"
    name: "C2"
    url: "${CAM2_URL}"
    enabled: true
