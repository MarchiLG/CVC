# Vision tasks per camera. "type" must be registered in
# tasks/registry.py — the built-ins (auto-registered when the "tasks"
# package is imported, see tasks/__init__.py) are:
#   item_counting, ppe_compliance, missing_product, print_monitor,
#   face_id, car_identification (the last two need optional
#   dependencies — see requirements.txt — and disappear from
#   GET /api/task-types when those aren't installed)
#
# The line/zone coordinates below are illustrative examples (assuming a
# ~1920x1080 frame) — use the Calibration screen of either interface to
# draw them over the live video instead of typing pixels by hand here.

cameras:
  cam1:
    tasks: []
  cam2:
    tasks: []
