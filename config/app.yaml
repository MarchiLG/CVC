# Global application settings. Every field is optional — anything not
# defined here falls back to the default in config/schema.py.

ui:
  # Interface language: en | pt (English is the default).
  #
  # This sets the language of the LLM narrator summaries and the
  # language the web interface (./run-html.sh, or run.bat on Windows)
  # starts in — there, a picker in the sidebar overrides it per browser,
  # no restart needed.
  #
  # The wording of the interface lives in a single catalog, src/i18n.py.
  language: en

vision:
  device: cuda  # auto | cpu | cuda
  model_size_override: models/detection/yolo26m.pt

db:
  enabled: false  # true also persists Flags into event_log (see notify/notifiers/db_notifier.py)
  url: sqlite:///data/app.db

llm:
  # Disabled by default: requires the Ollama service running locally
  # (`ollama serve`) with the model below already pulled (`ollama pull
  # qwen2.5:1.5b`). Without it the narrator fails quietly on every cycle
  # and only logs a warning — see llm/ollama_client.py.
  # Turn it on (enabled: true) after installing/running Ollama.
  enabled: false
  model: qwen2.5:1.5b
  interval_seconds: 60
  max_flags_per_summary: 20

notify:
  desktop:
    enabled: true
